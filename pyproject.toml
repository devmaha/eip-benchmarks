[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eip-execution-benchmarks"
version = "0.3.0rc1"
description = "Shared EIP execution-boundary core and AgentDyn/AgentDojo benchmark integrations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
openai = ["openai>=1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
